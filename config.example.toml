# Static service configuration.
#
# Copy this file to data/config.toml for local deployment-specific values. Relative filesystem
# paths and sqlite:// relative database paths are resolved from the config file directory.

[server]
host = "127.0.0.1"
port = 3000
temp_dir = ".tmp"

[database]
# Complete URL example below. To inject raw credentials instead, use:
# url = { base_url = "postgres://127.0.0.1:5432/app", username = "RAW_USERNAME", password = "RAW_PASSWORD" }
url = "sqlite://aster_gate.db?mode=rwc"
pool_size = 10
retry_count = 3

[cache]
# Supported backends: "memory", "redis".
backend = "memory"
# Redis examples: "redis://127.0.0.1:6379/0" or
# { base_url = "redis://127.0.0.1:6379/0", username = "", password = "RAW_PASSWORD" }.
endpoint = ""
default_ttl = 3600

[config_sync]
# Supported backends: "disabled", "redis". Use Redis to refresh config across replicas.
# AG publishes after committed writes and reloads through Forge's subscription supervisor.
backend = "disabled"
# Redis pubsub examples: "redis://127.0.0.1:6379/0" or
# { base_url = "redis://127.0.0.1:6379/0", username = "", password = "RAW_PASSWORD" }.
endpoint = ""
topic = "aster_gate.config_reload"

[logging]
# level examples: "info", "debug", "warn", "error", "tower_http=debug,aster_gate=debug".
level = "info"
# format examples: "text", "json".
format = "text"
file = ""
enable_rotation = false
max_backups = 5

[security]
# A missing master_key is generated once into the local config file at startup, as in AsterDrive.
# Generate a 64-character hexadecimal key with: openssl rand -hex 32
# For deployments with multiple replicas, inject one shared 32-byte key in this hex format:
# ASTER__SECURITY__MASTER_KEY. Back up this key with the database; never regenerate it on upgrade.
# master_key = "64_HEXADECIMAL_CHARACTERS"
# Ordered public site URLs (first is primary for email), site name/description, registration,
# verification policy, session lifetimes and optional SMTP settings are initialized through
# setup and stored in system_config. They can be changed from Instance settings. The initial management Account is
# created through setup. Account sessions + exact system permissions authorize management APIs.
